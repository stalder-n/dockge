version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 8
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      production-non-major:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-non-major:
        dependency-type: development
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "vite"
          - "@vitejs/*"
          - "sass"
          - "typescript"
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "vue-eslint-parser"
      vite-stack:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "sass"
        update-types:
          - minor
          - patch
      eslint-typescript:
        patterns:
          - "typescript"
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "vue-eslint-parser"
        update-types:
          - minor
          - patch
    ignore:
      # Human-driven majors only — prevents PR #2-style Vite 5→8 bundling
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/*"
        update-types: ["version-update:semver-major"]
      # Needs coordinated ESLint / @typescript-eslint upgrade first (PR #29)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # 0.x "minors" are effectively majors (e.g. 0.14 → 0.45); migrate manually
      - dependency-name: "bootstrap-vue-next"
      # Migrate $tc → $t plurals before allowing vue-i18n 11+
      - dependency-name: "vue-i18n"
        update-types: ["version-update:semver-major"]
      # Keep Font Awesome packages version-aligned; upgrade together manually
      - dependency-name: "@fortawesome/fontawesome-svg-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fortawesome/free-solid-svg-icons"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fortawesome/vue-fontawesome"
        update-types: ["version-update:semver-major"]
      # Only used by unused upstream helper (extra/close-incorrect-issue.js)
      - dependency-name: "@actions/github"
        update-types: ["version-update:semver-major"]
      # Prefer 3.1.x until we deliberately soak v4 shutdown behavior
      - dependency-name: "http-graceful-shutdown"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: master
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
